<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Panel Admin (Demo) — e-Solat</title>
  <meta name="description" content="Panel admin demo e-Solat: ubah pengumuman, waktu solat dan maklumat surau, kemudian lihat pada paparan TV berubah secara langsung.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://sky12388.github.io/esolat/admin/">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/admin-demo.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

  <header class="sticky top-0 z-30 border-b border-emerald-500/25 bg-slate-950/95 backdrop-blur px-4 py-3 safe-top">
    <div class="mx-auto flex max-w-5xl items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-500 font-black text-emerald-950">e</div>
      <div class="min-w-0 flex-1">
        <h1 class="truncate text-sm font-extrabold leading-tight sm:text-base">Panel Pentadbir · Demo</h1>
        <p class="truncate text-[11px] text-slate-400" id="syncStatus">Menyimpan pada pelayar ini sahaja</p>
      </div>
      <a href="../demo/" class="rounded-lg bg-emerald-500 px-3 py-2 text-xs font-bold text-emerald-950 transition hover:bg-emerald-400">Buka TV ↗</a>
    </div>
  </header>

  <div class="mx-auto max-w-5xl px-4 pb-24 pt-4">

    <!-- LIVE PREVIEW -->
    <section class="mb-4 overflow-hidden rounded-2xl border border-slate-800 bg-slate-900">
      <button type="button" id="previewToggle" class="flex w-full items-center justify-between gap-3 px-4 py-3 text-left">
        <span class="flex items-center gap-2 text-sm font-bold">
          <span class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
          Pratonton Langsung
        </span>
        <span class="text-[11px] text-slate-400" id="previewHint">Sembunyi</span>
      </button>
      <div id="previewWrap" class="hidden border-t border-slate-800 bg-black">
        <div class="aspect-video w-full">
          <iframe id="previewFrame" src="../demo/" title="Pratonton paparan TV e-Solat" class="h-full w-full border-0" loading="lazy"></iframe>
        </div>
      </div>
    </section>

    <div id="groups" class="space-y-4"></div>

    <!-- ACTION BAR -->
    <section class="mt-6 rounded-2xl border border-slate-800 bg-slate-900 p-4">
      <h2 class="mb-1 text-sm font-bold">Tindakan demo</h2>
      <p class="mb-3 text-[11px] leading-relaxed text-slate-400">
        Semua maklumat disimpan dalam pelayar pelawat sahaja (<code class="text-emerald-300">localStorage</code>) dan tidak pernah dihantar ke pelayan.
        Paparan TV dibuka dalam tab lain akan berubah secara serta-merta.
      </p>
      <div class="flex flex-wrap gap-2">
        <button type="button" id="btnReset" class="rounded-lg border border-rose-500/40 px-3 py-2 text-xs font-bold text-rose-300 transition hover:bg-rose-500/10">Set semula semua</button>
        <button type="button" id="btnCopy" class="rounded-lg border border-slate-700 px-3 py-2 text-xs font-bold text-slate-200 transition hover:bg-slate-800">Salin pautan demo</button>
        <a href="../" class="rounded-lg border border-slate-700 px-3 py-2 text-xs font-bold text-slate-200 transition hover:bg-slate-800">← Laman utama</a>
      </div>
    </section>
  </div>

  <script src="../demo/js/store.js"></script>
  <script src="../demo/js/prayer-times.js"></script>
  <script src="./js/admin-demo.js"></script>
</body>
</html>
