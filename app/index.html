<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=../admin/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-Solat Admin Mobile</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#064e3b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="e-Solat Admin">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <script>
    // Unregister legacy Service Workers under /app/ scope and clear stale caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          if (registration.scope.includes('/app')) {
            registration.unregister();
          }
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          if (name.includes('esolat') && !name.includes('v1.3.14')) {
            caches.delete(name);
          }
        }
      });
    }
    // Instant seamless redirect to Mobile Admin
    var targetUrl = '../admin/' + window.location.search + window.location.hash;
    window.location.replace(targetUrl);
  </script>
</head>
<body style="background:#022c22;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;padding:20px;box-sizing:border-box;text-align:center;">
  <div>
    <div style="font-size:3rem;margin-bottom:1rem;">📲</div>
    <h2 style="margin:0 0 0.5rem 0;font-size:1.4rem;">Mengalihkan ke e-Solat Admin Mobile...</h2>
    <p style="color:#a7f3d0;font-size:0.9rem;margin-bottom:1.5rem;">Sistem sedang memuatkan versi terkini v1.3.14.</p>
    <a href="../admin/" style="display:inline-block;padding:12px 24px;background:#059669;color:#ffffff;text-decoration:none;border-radius:12px;font-weight:bold;font-size:0.95rem;box-shadow:0 4px 14px rgba(0,0,0,0.4);">Buka Admin Sekarang &rarr;</a>
  </div>
</body>
</html>
