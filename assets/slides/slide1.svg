<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg1)"/>
  <circle cx="960" cy="450" r="500" fill="url(#goldGlow)"/>
  
  <!-- Islamic geometric frame -->
  <rect x="60" y="60" width="1800" height="960" rx="24" fill="none" stroke="#d97706" stroke-width="3" stroke-opacity="0.6"/>
  <rect x="76" y="76" width="1768" height="928" rx="16" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Bismillah & Header -->
  <text x="960" y="240" font-family="serif, sans-serif" font-size="52" fill="#fbbf24" text-anchor="middle" font-weight="bold">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
  <text x="960" y="320" font-family="system-ui, sans-serif" font-size="28" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">PERINGATAN DAN ADAB DI MASJID</text>
  
  <!-- Central Hadith Text -->
  <rect x="260" y="390" width="1400" height="380" rx="20" fill="#065f46" fill-opacity="0.35" stroke="#34d399" stroke-width="1" stroke-opacity="0.2"/>
  
  <text x="960" y="490" font-family="serif, sans-serif" font-size="44" fill="#ffffff" text-anchor="middle" font-weight="600">
    "Sebaik-baik tempat di muka bumi adalah masjid-masjidnya,"
  </text>
  <text x="960" y="560" font-family="serif, sans-serif" font-size="44" fill="#ffffff" text-anchor="middle" font-weight="600">
    "dan seburuk-buruk tempat adalah pasar-pasarnya."
  </text>
  <text x="960" y="660" font-family="system-ui, sans-serif" font-size="26" fill="#fbbf24" text-anchor="middle">
    — (Hadis Riwayat Muslim)
  </text>
  
  <!-- Footer Reminder -->
  <text x="960" y="870" font-family="system-ui, sans-serif" font-size="28" fill="#93c5fd" text-anchor="middle">
    ✦ Mohon matikan atau senyapkan nada dering telefon bimbit anda sebelum solat berjemaah dimulakan ✦
  </text>
</svg>